<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Route Line Path with Dashes -->
  <path d="M 120 380 C 140 260, 220 280, 260 220 C 300 160, 340 180, 390 130" 
        fill="none" stroke="#67e8f9" stroke-width="16" stroke-dasharray="14 10" stroke-linecap="round" opacity="0.85"/>
        
  <!-- Glowing Connection Nodes -->
  <circle cx="120" cy="380" r="18" fill="#10b981" filter="url(#shadow)"/>
  <circle cx="120" cy="380" r="8" fill="#ffffff"/>
  
  <circle cx="260" cy="220" r="16" fill="#f59e0b" filter="url(#shadow)"/>
  <circle cx="260" cy="220" r="7" fill="#ffffff"/>

  <!-- Destination Pin -->
  <g transform="translate(390, 130)" filter="url(#shadow)">
    <path d="M 0 -70 C -36 -70, -64 -42, -64 -6 C -64 36, 0 80, 0 80 C 0 80, 64 36, 64 -6 C 64 -42, 36 -70, 0 -70 Z" 
          fill="url(#pinGrad)"/>
    <circle cx="0" cy="-6" r="22" fill="#ffffff"/>
    <circle cx="0" cy="-6" r="12" fill="#b91c1c"/>
  </g>
  
  <!-- Navigation Arrow -->
  <g transform="translate(120, 380) rotate(-45)">
    <polygon points="0,-32 14,14 0,4 -14,14" fill="#ffffff"/>
  </g>
</svg>
